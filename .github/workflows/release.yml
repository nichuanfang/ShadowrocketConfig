name: 部署shadowrocket配置

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      # Validate before generating or publishing any Gist.
      - name: Test generator
        run: python -m unittest discover -s tests -v

      - name: Test publisher
        run: node --test tests/js/gist-publisher.test.cjs

      # Prepare all profiles and validate every release artifact before publishing.
      - name: prepare
        run: python main.py --release

      - name: Publish profiles to Gists
        uses: actions/github-script@v9.0.0
        env:
          FREE_GIST_ID: ${{ secrets.FREE_GIST_ID }}
          BLACK_GIST_ID: ${{ secrets.BLACK_GIST_ID }}
          BLACK_AD_GIST_ID: ${{ secrets.BLACK_AD_GIST_ID }}
          BLACK_ACCELERATE_GIST_ID: ${{ secrets.BLACK_ACCELERATE_GIST_ID }}
          BLACK_ACCELERATE_AD_GIST_ID: ${{ secrets.BLACK_ACCELERATE_AD_GIST_ID }}
          WHITE_GIST_ID: ${{ secrets.WHITE_GIST_ID }}
          WHITE_AD_GIST_ID: ${{ secrets.WHITE_AD_GIST_ID }}
          WHITE_ACCELERATE_GIST_ID: ${{ secrets.WHITE_ACCELERATE_GIST_ID }}
          WHITE_ACCELERATE_AD_GIST_ID: ${{ secrets.WHITE_ACCELERATE_AD_GIST_ID }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { publishRelease } = require('./.github/scripts/gist-publisher.cjs');
            await publishRelease(process.env.GITHUB_WORKSPACE, process.env, github);
